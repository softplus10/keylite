name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p keylite-core -p keylite-native
      - run: cargo clippy -p keylite-core -p keylite-native --all-targets -- -D warnings
      - run: bash scripts/smoke.sh
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p keylite-worker --target wasm32-unknown-unknown
      - run: cargo install worker-build --locked
      - run: worker-build --release
