[package]
name = "keylite-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
keylite-core = { path = "../core" }
worker = { version = "0.9", features = ["d1"] }
serde.workspace = true
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "js"] }
