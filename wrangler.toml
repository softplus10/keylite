name = "keylite"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-11-18"
workers_dev = true
preview_urls = false

[build]
command = "cd crates/worker && worker-build --release"

[vars]
KEYLITE_MAX_USERS = "0"
KEYLITE_MAX_VAULTS_PER_USER = "0"

[[d1_databases]]
binding = "DB"
database_name = "keylite"
database_id = "1152514f-5e71-4508-9919-7179571f6cbe"
migrations_dir = "migrations"
